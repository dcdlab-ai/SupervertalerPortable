[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supervertaler"
version = "1.10.371"
description = "Professional AI-enhanced translation workbench with multi-LLM support, termbase system, TM, spellcheck, voice commands, and PyQt6 interface. Batteries included (core)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Michael Beijer", email = "support@supervertaler.com"},
]
maintainers = [
    {name = "Michael Beijer", email = "support@supervertaler.com"},
]
keywords = [
    "translation",
    "CAT",
    "CAT-tool",
    "AI",
    "LLM",
    "GPT",
    "Claude",
    "Gemini",
    "Ollama",
    "glossary",
    "termbase",
    "translation-memory",
    "TM",
    "PyQt6",
    "localization",
    "memoQ",
    "Trados",
    "SDLPPX",
    "XLIFF",
    "voice-commands",
    "spellcheck",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Linguistic",
    "Environment :: X11 Applications :: Qt",
]

dependencies = [
    # Core UI Framework
    "PyQt6>=6.5.0",

    # Document Processing
    "python-docx>=0.8.11",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",

    # AI/LLM provider — единственный живой после BATCH P2.2:
    # OpenAI-совместимый API (все провайдеры идут через custom_openai)
    "openai>=1.0.0",
    "requests>=2.28.0",

    # Clipboard Operations
    "pyperclip>=1.8.2",

    # Basic Spellchecking (lightweight, works offline)
    "pyspellchecker>=0.7.0",

    # Advanced spellcheck (Hunspell via pure Python)
    "spylls>=0.1.7",
]

[project.optional-dependencies]
# Наполненные бакеты (BATCH P2.3): всё, что продукт импортирует только
# лениво/guarded с graceful-деградацией. ``pip install supervertaler``
# ставит только dependencies — ядро работает без extras.
import = [
    # Импорт документов в промпты (.pdf/.docx/.pptx/.xlsx -> markdown);
    # тянет onnxruntime. Без него файл вставляется заглушкой.
    "markitdown>=0.0.1",
]
linux-hotkeys = [
    # Глобальные горячие клавиши / эмуляция клавиш на Linux
    # (Windows использует RegisterHotKey/AHK).
    "pynput>=1.7.6; sys_platform == 'linux'",
]
# Пустые бакеты сохранены как no-ops для обратной совместимости —
# существующие скрипты, запрашивающие эти extras, не падают при установке.
local-whisper = []
voice = []
web = []
pdf = []
mt = []
hunspell = []
windows = []
core = []
all = []

[project.urls]
Homepage = "https://supervertaler.com"
Repository = "https://github.com/Supervertaler/Supervertaler-Workbench.git"
"Bug Tracker" = "https://github.com/Supervertaler/Supervertaler-Workbench/issues"
Changelog = "https://github.com/Supervertaler/Supervertaler-Workbench/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Supervertaler/Supervertaler-Workbench/blob/main/AGENTS.md"
"Author Website" = "https://beijer.uk"

[project.gui-scripts]
# Normal launcher — Windows GUI subsystem, no terminal window attached.
# Most users want this: pip-installed `supervertaler` runs silently.
supervertaler = "Supervertaler:main"

[project.scripts]
# Debug launcher — Windows console subsystem, terminal window visible so
# stdout/stderr (all the [LOG] lines) are usable. Invoke via
# `supervertaler-debug` when you need to see crashes or diagnostic output.
supervertaler-debug = "Supervertaler:main"

[tool.setuptools]
py-modules = ["Supervertaler"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*"]
